<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NATUREX · ANTARA — Spatial Nature &amp; Expedition Intelligence Platform</title>
  <meta name="description" content="NATUREX · ANTARA — Spatial Nature &amp; Expedition Intelligence Platform. Discover 120+ destinations across Odisha &amp; India, plan multi-day trails, calculate road costs, collect passport stamps, and experience spatial 3D exploration." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ivory: { 50: '#FDFBF7', 100: '#FAF7F0', 200: '#F5EFE3', 300: '#EDE4D3' },
            parchment: '#F0E8D8',
            forest: { 900: '#0B1A12', 800: '#112014', 700: '#1B3B2B', 600: '#2A5A40', 500: '#3D7A5A', 400: '#5A9B78' },
            sage: { 900: '#2A4A3A', 700: '#4A7C6F', 500: '#6B9E8F', 300: '#9EBFB3', 100: '#D4E8E2' },
            gold: { 800: '#8B6914', 700: '#A67C1A', 600: '#C4941E', 500: '#D4AF37', 400: '#E8C84A' },
            amber: { 700: '#B45309', 600: '#D97706', 500: '#F59E0B' },
            terracotta: { 700: '#9B3A1A', 600: '#C1440E', 500: '#D4521A' },
            stone: { 50: '#FAFAF9', 100: '#F5F5F4', 200: '#E7E5E4', 300: '#D6D3D1', 400: '#A8A29E', 500: '#78716C', 600: '#57534E', 700: '#44403C', 800: '#292524', 900: '#1C1917' }
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            script: ['Sacramento', 'cursive'],
            mono: ['JetBrains Mono', 'Courier New', 'monospace']
          },
          animation: {
            'fade-up': 'fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards',
            'fade-in': 'fadeIn 0.5s ease forwards',
            'scale-in': 'scaleIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards',
            'slide-right': 'slideRight 0.4s cubic-bezier(0.22,1,0.36,1) forwards'
          },
          keyframes: {
            fadeUp: { from: { opacity: '0', transform: 'translateY(24px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            fadeIn: { from: { opacity: '0' }, to: { opacity: '1' } },
            scaleIn: { from: { opacity: '0', transform: 'scale(0.94)' }, to: { opacity: '1', transform: 'scale(1)' } },
            slideRight: { from: { transform: 'translateX(-100%)' }, to: { transform: 'translateX(0)' } }
          }
        }
      }
    };
  </script>

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Design System -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/redesign.css" />
</head>

<body class="wf-body antialiased overflow-x-hidden has-custom-cursor" id="wf-root">

  <!-- Custom Magnetic Cursor -->
  <div id="nx-cursor-dot" class="nx-cursor-dot"></div>
  <div id="nx-cursor-ring" class="nx-cursor-ring"></div>

  <!-- Page Loader Bar -->
  <div id="wf-page-loader" class="hidden"></div>

  <!-- Back to Top Button -->
  <button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top" aria-label="Back to top">↑</button>

  <!-- =====================================================================
       FLOATING TOP NAVIGATION — ANTARA Brand Glass Pill
  ====================================================================== -->
  <header id="wf-header" class="fixed top-0 left-0 right-0 z-50 px-4 pt-4 transition-all duration-300 pointer-events-none">
    <div class="max-w-7xl mx-auto flex items-center justify-between pointer-events-auto">

      <!-- Brand -->
      <button
        id="nav-brand"
        onclick="WF.switchView('discover')"
        class="wf-glass rounded-2xl px-4 py-2.5 flex items-center gap-2.5 border border-white/10 shadow-lg hover:shadow-xl transition-all duration-300 group"
        aria-label="Go to home"
      >
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-800 flex items-center justify-center text-white text-xs font-bold font-sans shadow-md">NX</div>
        <div class="hidden sm:block text-left">
          <span class="text-sm font-bold tracking-[0.2em] uppercase wf-text-primary font-sans">NATUREX</span>
          <span class="text-[8px] tracking-[0.22em] uppercase text-emerald-600 dark:text-emerald-400 font-semibold block leading-none mt-0.5">Expedition OS</span>
        </div>
      </button>

      <!-- Desktop Nav Pills (All 10 OS Modules) -->
      <nav class="hidden lg:flex wf-glass rounded-2xl border border-white/10 p-1 shadow-lg gap-0.5 items-center text-xs" role="navigation" aria-label="Main navigation">
        <button data-nav="discover"   class="wf-nav-btn" id="nav-discover">Discover</button>
        <button data-nav="explore"    class="wf-nav-btn" id="nav-explore">Explore</button>
        <button data-nav="bucketlist" class="wf-nav-btn" id="nav-bucketlist">Bucket List</button>
        <button data-nav="trips"      class="wf-nav-btn" id="nav-trips">Trips</button>
        <button data-nav="checklist"  class="wf-nav-btn" id="nav-checklist">Checklist</button>
        <button data-nav="journal"    class="wf-nav-btn" id="nav-journal">Journal</button>
        <button data-nav="passport"   class="wf-nav-btn" id="nav-passport">Passport</button>
        <button data-nav="map"        class="wf-nav-btn" id="nav-map">Map</button>
        <button data-nav="insights"   class="wf-nav-btn" id="nav-insights">Insights</button>
      </nav>

      <!-- Right Controls -->
      <div class="flex items-center gap-2 pointer-events-auto">

        <!-- Travel Bag / Saved Control -->
        <button
          id="btn-saved-bag"
          onclick="WF.openTravelBag()"
          class="wf-glass rounded-xl px-3 py-2 flex items-center gap-1.5 border border-white/10 shadow-md hover:shadow-lg transition-all duration-200 wf-text-secondary text-xs relative"
          title="Saved Places / Travel Bag"
        >
          <span class="text-sm">📌</span>
          <span class="hidden sm:inline font-medium">Bag</span>
          <span id="saved-bag-count" class="wf-bag-badge">0</span>
        </button>

        <!-- Search -->
        <button
          id="btn-search"
          onclick="WayfarerCommandPalette && WayfarerCommandPalette.toggle()"
          class="wf-glass rounded-xl px-3 py-2 flex items-center gap-2 border border-white/10 shadow-md hover:shadow-lg transition-all duration-200 wf-text-secondary text-xs"
          title="Search (⌘K)"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span class="hidden sm:inline">Search</span>
          <kbd class="hidden md:inline bg-black/10 dark:bg-white/10 text-[9px] px-1.5 py-0.5 rounded font-mono">⌘K</kbd>
        </button>

        <!-- Theme -->
        <button
          id="btn-theme"
          onclick="WF.toggleTheme()"
          class="wf-glass w-9 h-9 rounded-xl border border-white/10 shadow-md flex items-center justify-center transition-all hover:scale-105"
          title="Toggle theme"
          aria-label="Toggle dark/light mode"
        >
          <span id="theme-icon-moon" class="text-sm">🌙</span>
          <span id="theme-icon-sun" class="text-sm hidden">☀️</span>
        </button>

        <!-- Profile -->
        <button
          id="btn-profile"
          onclick="WF.switchView('settings')"
          class="wf-glass w-9 h-9 rounded-xl border border-white/10 shadow-md flex items-center justify-center hover:scale-105 transition-all"
          title="Profile & Settings"
          aria-label="Profile settings"
        >
          <span class="text-sm font-bold font-serif wf-text-primary" id="profile-initials">AN</span>
        </button>
      </div>

    </div>
  </header>

  <!-- =====================================================================
       MOBILE BOTTOM NAVIGATION — fixed dock with 1-tap apps launcher
  ====================================================================== -->
  <nav
    id="wf-mobile-nav"
    class="lg:hidden fixed bottom-0 left-0 right-0 z-50 safe-bottom"
    role="navigation"
    aria-label="Mobile navigation"
  >
    <div class="mx-2 mb-2 wf-glass rounded-2xl border border-white/15 shadow-2xl">
      <div class="flex items-center justify-around py-2 px-1">
        <button data-nav="discover" class="wf-mob-btn" id="mob-discover" aria-label="Discover">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Home</span>
        </button>
        <button data-nav="explore" class="wf-mob-btn" id="mob-explore" aria-label="Explore">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
          <span>Explore</span>
        </button>
        <button data-nav="bucketlist" class="wf-mob-btn" id="mob-bucketlist" aria-label="Bucket List">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <span>Bucket</span>
        </button>
        <button data-nav="trips" class="wf-mob-btn" id="mob-trips" aria-label="My Trips">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span>Trips</span>
        </button>
        <button data-nav="map" class="wf-mob-btn" id="mob-map" aria-label="Map">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Map</span>
        </button>
        <button onclick="WF.openAppsSheet()" class="wf-mob-btn" id="mob-apps" aria-label="More OS Apps">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Apps</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- =====================================================================
       MOBILE OS APPS SUITE SHEET
  ====================================================================== -->
  <div id="apps-sheet-overlay" class="fixed inset-0 z-[68] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="WF.closeAppsSheet()"></div>
  <div id="apps-sheet" class="fixed bottom-0 left-0 right-0 z-[69] wf-surface rounded-t-3xl border-t wf-border shadow-2xl translate-y-full transition-transform duration-300 p-6 max-h-[85vh] overflow-y-auto" aria-label="ANTARA Travel OS Apps">
    <div class="flex items-center justify-between pb-4 border-b wf-border mb-5">
      <div class="flex items-center gap-2">
        <span class="text-xl">✨</span>
        <h3 class="font-serif wf-text-primary text-xl font-semibold">ANTARA OS Suite</h3>
      </div>
      <button onclick="WF.closeAppsSheet()" class="wf-btn wf-btn-ghost wf-btn-icon">✕</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <button onclick="WF.switchView('checklist'); WF.closeAppsSheet();" class="wf-card p-4 rounded-2xl flex flex-col items-start gap-2 text-left hover:border-emerald-600 transition-colors">
        <span class="text-2xl">🎒</span>
        <div class="font-medium wf-text-primary text-sm">Packing Checklist</div>
        <span class="text-[11px] wf-text-muted">Gear kits & readiness score</span>
      </button>

      <button onclick="WF.switchView('journal'); WF.closeAppsSheet();" class="wf-card p-4 rounded-2xl flex flex-col items-start gap-2 text-left hover:border-emerald-600 transition-colors">
        <span class="text-2xl">📖</span>
        <div class="font-medium wf-text-primary text-sm">Field Notes & Journal</div>
        <span class="text-[11px] wf-text-muted">Memories, photos & moods</span>
      </button>

      <button onclick="WF.switchView('passport'); WF.closeAppsSheet();" class="wf-card p-4 rounded-2xl flex flex-col items-start gap-2 text-left hover:border-emerald-600 transition-colors">
        <span class="text-2xl">🛂</span>
        <div class="font-medium wf-text-primary text-sm">Travel Passport</div>
        <span class="text-[11px] wf-text-muted">30-District stamps & badges</span>
      </button>

      <button onclick="WF.switchView('insights'); WF.closeAppsSheet();" class="wf-card p-4 rounded-2xl flex flex-col items-start gap-2 text-left hover:border-emerald-600 transition-colors">
        <span class="text-2xl">🧬</span>
        <div class="font-medium wf-text-primary text-sm">Explorer DNA</div>
        <span class="text-[11px] wf-text-muted">Terrain affinities & stats</span>
      </button>

      <button onclick="WF.openTravelBag(); WF.closeAppsSheet();" class="wf-card p-4 rounded-2xl flex flex-col items-start gap-2 text-left hover:border-emerald-600 transition-colors">
        <span class="text-2xl">📌</span>
        <div class="font-medium wf-text-primary text-sm">Travel Bag</div>
        <span class="text-[11px] wf-text-muted">Saved places pipeline</span>
      </button>

      <button onclick="WF.switchView('settings'); WF.closeAppsSheet();" class="wf-card p-4 rounded-2xl flex flex-col items-start gap-2 text-left hover:border-emerald-600 transition-colors">
        <span class="text-2xl">⚙️</span>
        <div class="font-medium wf-text-primary text-sm">Settings & DB</div>
        <span class="text-[11px] wf-text-muted">Home base, CSV export/import</span>
      </button>
    </div>
  </div>

  <!-- =====================================================================
       MAIN CONTENT AREA — all 10 OS modules rendered here
  ====================================================================== -->
  <main id="wf-main" class="min-h-screen" role="main">
    <div id="view-discover"   class="wf-view"></div>
    <div id="view-explore"    class="wf-view hidden"></div>
    <div id="view-bucketlist" class="wf-view hidden"></div>
    <div id="view-trips"      class="wf-view hidden"></div>
    <div id="view-checklist"  class="wf-view hidden"></div>
    <div id="view-journal"    class="wf-view hidden"></div>
    <div id="view-passport"   class="wf-view hidden"></div>
    <div id="view-map"        class="wf-view hidden"></div>
    <div id="view-insights"   class="wf-view hidden"></div>
    <div id="view-memories"   class="wf-view hidden"></div>
    <div id="view-settings"   class="wf-view hidden"></div>
  </main>

  <!-- =====================================================================
       DESTINATION DETAIL PANEL — full-screen slide-in
  ====================================================================== -->
  <div id="dest-panel-overlay" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="WF.closeDestPanel()"></div>
  <aside
    id="dest-panel"
    class="fixed top-0 right-0 h-full w-full md:w-[560px] lg:w-[620px] z-[61] wf-dest-panel translate-x-full transition-transform duration-500 ease-out overflow-y-auto"
    aria-label="Destination details"
  >
    <div id="dest-panel-inner" class="min-h-full"></div>
  </aside>

  <!-- =====================================================================
       TRAVEL BAG / SAVED DRAWER MODAL
  ====================================================================== -->
  <div id="travel-bag-overlay" class="fixed inset-0 z-[65] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="WF.closeTravelBag()"></div>
  <aside
    id="travel-bag-panel"
    class="fixed top-0 right-0 h-full w-full sm:w-[420px] z-[66] wf-surface border-l wf-border translate-x-full transition-transform duration-400 ease-out overflow-y-auto p-6"
    aria-label="Travel Bag Saved Places"
  >
    <div id="travel-bag-inner"></div>
  </aside>

  <!-- =====================================================================
       TRIP FORM MODAL
  ====================================================================== -->
  <div id="trip-modal-overlay" class="fixed inset-0 z-[70] bg-black/70 backdrop-blur-md hidden items-center justify-center p-4" onclick="WF.closeTripModal(event)">
    <div id="trip-modal" class="wf-surface rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl border wf-border" onclick="event.stopPropagation()">
      <div id="trip-modal-inner" class="p-6 md:p-8"></div>
    </div>
  </div>

  <!-- =====================================================================
       COMMAND PALETTE (⌘K)
  ====================================================================== -->
  <div id="command-palette-overlay" class="fixed inset-0 z-[80] hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="WayfarerCommandPalette && WayfarerCommandPalette.toggle()"></div>
    <div class="relative z-10 flex items-start justify-center pt-24 px-4">
      <div class="w-full max-w-xl wf-glass rounded-2xl border wf-border shadow-2xl overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b wf-border">
          <svg class="w-4 h-4 wf-text-muted flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input
            id="command-search-input"
            type="text"
            placeholder="Search ANTARA: destinations, districts, trips..."
            class="flex-1 bg-transparent text-base wf-text-primary placeholder:wf-text-muted focus:outline-none font-sans"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="text-[9px] bg-black/10 dark:bg-white/10 px-1.5 py-0.5 rounded font-mono wf-text-muted">ESC</kbd>
        </div>
        <div id="command-search-results" class="max-h-80 overflow-y-auto p-2"></div>
      </div>
    </div>
  </div>

  <!-- =====================================================================
       TOAST NOTIFICATIONS
  ====================================================================== -->
  <div id="toast-container" class="fixed bottom-[88px] lg:bottom-6 right-4 z-[90] flex flex-col gap-2 items-end pointer-events-none" aria-live="polite" role="status"></div>

  <!-- =====================================================================
       IMAGE LIGHTBOX
  ====================================================================== -->
  <div id="lightbox" class="fixed inset-0 z-[95] bg-black/95 hidden items-center justify-center p-4" onclick="WF.closeLightbox()">
    <button class="absolute top-4 right-4 text-white/70 hover:text-white text-2xl transition-colors z-10" aria-label="Close lightbox">✕</button>
    <img id="lightbox-img" src="" alt="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl" />
    <p id="lightbox-caption" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-white/60 text-sm text-center"></p>
  </div>

  <!-- =====================================================================
       SCRIPT LOADING ORDER
  ====================================================================== -->

  <!-- Data Layer -->
  <script src="js/assets.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data/odishaData.js"></script>
  <script src="js/data/indiaData.js"></script>
  <script src="js/data/globalData.js"></script>
  <script src="js/data/costEngine.js"></script>
  <script src="js/data/activitiesData.js"></script>
  <script src="js/data/itineraryEngine.js"></script>
  <script src="js/data/holidaysData.js"></script>
  <script src="js/data/expeditionData.js"></script>

  <!-- Core Store -->
  <script src="js/store.js"></script>

  <!-- Components -->
  <script src="js/components/notifications.js"></script>
  <script src="js/components/commandPalette.js"></script>
  <script src="js/components/drawer.js"></script>
  <script src="js/components/audioEngine.js"></script>

  <!-- Views -->
  <script src="js/views/discoverView.js"></script>
  <script src="js/views/exploreView.js"></script>
  <script src="js/views/bucketListView.js"></script>
  <script src="js/views/tripsView.js"></script>
  <script src="js/views/checklistView.js"></script>
  <script src="js/views/journalView.js"></script>
  <script src="js/views/passportView.js"></script>
  <script src="js/views/mapView.js"></script>
  <script src="js/views/insightsView.js"></script>
  <script src="js/views/memoriesView.js"></script>
  <script src="js/views/settingsView.js"></script>

  <!-- Application Controller -->
  <script src="js/app.js"></script>

</body>
</html>
