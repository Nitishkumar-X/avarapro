<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAYFARER V2 — Personal Travel Intelligence Operating System</title>
  <meta name="description" content="A commercial-grade travel intelligence operating system, destination explorer, and personal travel passport." />

  <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, Sacramento -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forest: {
              900: '#0B120E',
              800: '#121A15',
              700: '#1B3B2B',
              600: '#2A5640',
              500: '#02C39A',
            },
            ivory: {
              50: '#FAF8F5',
              100: '#F5F2EB',
              200: '#EFECE6',
            },
            gold: '#C5A059',
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            script: ['Sacramento', 'cursive'],
          }
        }
      }
    }
  </script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- V2 Design System CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-[#FAF8F5] dark:bg-[#0B120E] text-[#1C1917] dark:text-[#F5F5F0] antialiased min-h-screen flex flex-col selection:bg-[#1B3B2B] selection:text-white dark:selection:bg-[#02C39A] dark:selection:text-black">

  <!-- TOP FLOATING SPATIAL NAVIGATION BAR -->
  <header class="sticky top-0 z-40 w-full px-4 md:px-8 py-3.5 transition-all">
    <div class="max-w-7xl mx-auto spatial-glass rounded-full px-5 py-3 flex items-center justify-between shadow-xl border border-black/5 dark:border-white/10">
      
      <!-- BRAND LOGO -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.wayfarerApp.switchTab('home')">
        <div class="w-9 h-9 rounded-full bg-[#1B3B2B] dark:bg-[#02C39A] text-white dark:text-black flex items-center justify-center font-serif text-lg font-bold shadow-md">
          W
        </div>
        <div>
          <h1 class="font-serif font-bold text-lg tracking-wider text-[#1C1917] dark:text-white uppercase leading-none">WAYFARER <span class="text-xs text-[#1B3B2B] dark:text-[#02C39A] font-sans">V2</span></h1>
          <span class="text-[9px] tracking-widest uppercase font-semibold text-[#1B3B2B] dark:text-[#02C39A] block">Travel Intelligence OS</span>
        </div>
      </div>

      <!-- DESKTOP NAVIGATION TABS -->
      <nav class="hidden lg:flex items-center gap-1 bg-black/5 dark:bg-white/5 p-1 rounded-full border border-black/5 dark:border-white/5">
        <button data-nav-target="home" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          01 Discover
        </button>
        <button data-nav-target="explore" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          02 Explore
        </button>
        <button data-nav-target="bucketlist" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          03 Bucket List
        </button>
        <button data-nav-target="trips" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          04 Trips
        </button>
        <button data-nav-target="checklist" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          05 Checklist
        </button>
        <button data-nav-target="journal" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          06 Journal
        </button>
        <button data-nav-target="passport" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          07 Passport
        </button>
        <button data-nav-target="map" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          08 Map
        </button>
        <button data-nav-target="insights" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          09 Insights
        </button>
        <button data-nav-target="settings" class="px-4 py-2 rounded-full text-xs font-semibold transition-all hover:text-[#1B3B2B] dark:hover:text-white">
          10 Settings
        </button>
      </nav>

      <!-- RIGHT UTILITY ACTIONS -->
      <div class="flex items-center gap-2.5">
        <!-- Search Trigger -->
        <button
          onclick="window.WayfarerCommandPalette.toggle()"
          class="px-3.5 py-2 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-xs font-medium flex items-center gap-2 transition-all border border-black/5 dark:border-white/10"
          title="Search Travel OS (Cmd+K)"
        >
          <svg class="w-3.5 h-3.5 text-[#1B3B2B] dark:text-[#02C39A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span class="hidden sm:inline">Search</span>
          <kbd class="hidden sm:inline text-[9px] bg-black/10 dark:bg-white/15 px-1.5 py-0.5 rounded font-mono">⌘K</kbd>
        </button>

        <!-- Theme Switcher -->
        <button
          onclick="window.wayfarerApp.toggleTheme()"
          class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 flex items-center justify-center text-sm transition-all border border-black/5 dark:border-white/10"
          title="Toggle Warm Editorial / Obsidian Mode"
        >
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>

        <!-- Profile Badge -->
        <div onclick="window.wayfarerApp.switchTab('settings')" class="w-9 h-9 rounded-full bg-[#1B3B2B] text-white dark:bg-[#02C39A] dark:text-black flex items-center justify-center font-bold text-xs shadow-md cursor-pointer hover:scale-105 transition-transform" title="Profile Settings">
          NS
        </div>
      </div>

    </div>
  </header>

  <!-- MOBILE BOTTOM FLOATING DOCK -->
  <nav class="lg:hidden fixed bottom-4 left-4 right-4 spatial-glass p-2 z-40 rounded-full border border-black/10 dark:border-white/15 shadow-2xl flex justify-around items-center text-xs">
    <button data-nav-target="home" class="flex flex-col items-center p-2 rounded-full text-sage-300">
      <span class="text-base">🏠</span>
      <span class="text-[9px] font-semibold">Discover</span>
    </button>
    <button data-nav-target="explore" class="flex flex-col items-center p-2 rounded-full text-sage-300">
      <span class="text-base">🧭</span>
      <span class="text-[9px] font-semibold">Explore</span>
    </button>
    <button data-nav-target="bucketlist" class="flex flex-col items-center p-2 rounded-full text-sage-300">
      <span class="text-base">📌</span>
      <span class="text-[9px] font-semibold">Bucket</span>
    </button>
    <button data-nav-target="trips" class="flex flex-col items-center p-2 rounded-full text-sage-300">
      <span class="text-base">🎒</span>
      <span class="text-[9px] font-semibold">Trips</span>
    </button>
    <button data-nav-target="journal" class="flex flex-col items-center p-2 rounded-full text-sage-300">
      <span class="text-base">📖</span>
      <span class="text-[9px] font-semibold">Journal</span>
    </button>
    <button data-nav-target="passport" class="flex flex-col items-center p-2 rounded-full text-sage-300">
      <span class="text-base">🛂</span>
      <span class="text-[9px] font-semibold">Passport</span>
    </button>
  </nav>

  <!-- MAIN VIEW CONTAINER -->
  <main class="flex-1 px-4 md:px-8 py-6 max-w-7xl mx-auto w-full pb-28 lg:pb-12 overflow-hidden">
    <div id="view-home" class="view-container"></div>
    <div id="view-explore" class="view-container hidden"></div>
    <div id="view-bucketlist" class="view-container hidden"></div>
    <div id="view-trips" class="view-container hidden"></div>
    <div id="view-checklist" class="view-container hidden"></div>
    <div id="view-journal" class="view-container hidden"></div>
    <div id="view-passport" class="view-container hidden"></div>
    <div id="view-map" class="view-container hidden"></div>
    <div id="view-insights" class="view-container hidden"></div>
    <div id="view-settings" class="view-container hidden"></div>
  </main>

  <!-- REUSABLE SLIDE DRAWER CONTAINER -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden transition-opacity"></div>
  <aside id="drawer-container" class="fixed top-0 right-0 w-full md:w-[500px] h-full spatial-glass backdrop-blur-3xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col justify-between p-6 md:p-8 overflow-y-auto border-l border-black/10 dark:border-white/15 shadow-2xl rounded-none">
    <div class="flex items-center justify-between pb-4 border-b border-black/10 dark:border-white/10 mb-6">
      <h3 id="drawer-title" class="font-serif text-2xl font-bold text-[#1C1917] dark:text-white">Details</h3>
      <button id="drawer-close-btn" class="w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 text-xs flex items-center justify-center hover:scale-105 transition-transform">✕</button>
    </div>
    <div id="drawer-body" class="flex-1"></div>
  </aside>

  <!-- COMMAND PALETTE MODAL (CMD + K) -->
  <div id="command-palette-modal" class="fixed inset-0 z-50 hidden">
    <div id="command-palette-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-md"></div>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 w-[92%] max-w-2xl spatial-glass p-6 rounded-3xl shadow-2xl z-50 border border-black/10 dark:border-white/15">
      <div class="flex items-center gap-3 border-b border-black/10 dark:border-white/10 pb-4 mb-4">
        <span class="text-xl text-[#1B3B2B] dark:text-[#02C39A]">🔍</span>
        <input
          id="command-search-input"
          type="text"
          placeholder="Search destinations, trips, memories, checklist items..."
          class="w-full bg-transparent text-lg text-[#1C1917] dark:text-white focus:outline-none placeholder-stone-400 font-serif"
        />
        <kbd class="text-xs bg-black/10 dark:bg-white/15 px-2 py-1 rounded-md font-mono">ESC</kbd>
      </div>

      <div id="command-search-results" class="max-h-96 overflow-y-auto space-y-2"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS CONTAINER -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-3 pointer-events-none"></div>

  <!-- SCRIPT INCLUSIONS -->
  <script src="js/assets.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data/indiaData.js"></script>
  <script src="js/data/globalData.js"></script>
  <script src="js/data/costEngine.js"></script>
  <script src="js/data/activitiesData.js"></script>
  <script src="js/data/itineraryEngine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/drawer.js"></script>
  <script src="js/components/commandPalette.js"></script>
  <script src="js/components/notifications.js"></script>
  <script src="js/views/homeView.js"></script>
  <script src="js/views/exploreView.js"></script>
  <script src="js/views/bucketListView.js"></script>
  <script src="js/views/tripsView.js"></script>
  <script src="js/views/checklistView.js"></script>
  <script src="js/views/journalView.js"></script>
  <script src="js/views/passportView.js"></script>
  <script src="js/views/mapView.js"></script>
  <script src="js/views/insightsView.js"></script>
  <script src="js/views/settingsView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
